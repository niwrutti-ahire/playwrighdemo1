name: LoginPage

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install
      - run: npm install --save-dev allure-playwright allure-commandline
      - run: npx playwright test --reporter=allure-playwright
      - run: npx allure generate ./allure-results -o ./allure-report --clean
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report
      - uses: actions/upload-pages-artifact@v1
        with:
          path: ./allure-report

  deploy-pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v1
