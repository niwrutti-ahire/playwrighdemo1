name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Install Allure CLI
      run: npm install --global allure-commandline
    - name: Run Playwright tests
      run: npx playwright test
    - name: Generate Allure report
      if: ${{ always() }}
      run: npm run allure:generate
    - name: Archive Allure report
      if: ${{ always() }}
      run: |
        if [ -d allure-report ]; then
          zip -r allure-report.zip allure-report
        fi
    - name: Upload Playwright and Allure reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          playwright-report/
          allure-report/
          allure-report.zip
        retention-days: 30
    - name: Send test report email
      if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: dawidd6/action-send-mail@v6
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: Playwright test result: ${{ job.status }}
        to: ${{ secrets.EMAIL_TO }}
        from: ${{ secrets.EMAIL_FROM }}
        content_type: text/html
        body: |
          <h2>Playwright test result: ${{ job.status }}</h2>
          <p>Repository: ${{ github.repository }}</p>
          <p>Branch or event: ${{ github.ref_name }}</p>
          <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View the GitHub Actions run</a></p>
        attachments: allure-report.zip
