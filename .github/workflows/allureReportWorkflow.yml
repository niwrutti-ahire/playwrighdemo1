name: Allure Report Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - run: npm ci
      - run: npx playwright install
      - run: npm install --save-dev allure-playwright allure-commandline
      
      - name: Run tests
        run: npx playwright test --reporter=allure-playwright
      
      - name: Generate Allure report
        if: ${{ always() }}
        run: npx allure generate ./allure-results -o ./allure-report --clean
      
      - name: Deploy to GitHub Pages
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
      
      - name: Display Report URL
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "Allure Report URL: https://niwrutti-ahire.github.io/playwrighdemo1/"
